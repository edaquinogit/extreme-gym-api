spring.datasource.url=jdbc:postgresql://localhost:5432/extreme_db
spring.datasource.username=extreme_user
spring.datasource.password=extreme_pass

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

app.auth.registration-enabled=${AUTH_REGISTRATION_ENABLED:false}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:5177,http://localhost:5178,http://localhost:5179,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175,http://127.0.0.1:5176,http://127.0.0.1:5177,http://127.0.0.1:5178,http://127.0.0.1:5179}

# JWT Configuration for Development
# Use um secret consistente para dev local (gerado via openssl rand -base64 32)
# IMPORTANTE: Este é APENAS para desenvolvimento. Nunca use em produção!
jwt.secret=${JWT_SECRET:dev-MzA3NDAzNTkwNzcwOTMzMDgyODI5NjM4NzYwNzA4Ng==}
jwt.expiration-minutes=1440

# Admin Credentials for Development
# IMPORTANTE: Estas credenciais são APENAS para desenvolvimento
# Em produção, altere via variáveis de ambiente e configure senha forte
app.bootstrap-admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:true}
app.admin.email=${ADMIN_EMAIL:admin@extremegym.local}
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin@123Dev!}
