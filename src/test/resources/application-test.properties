spring.datasource.url=jdbc:h2:mem:extreme_test_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

jwt.secret=ciJwtKeyForAutomatedTestsOnly2026SafeValueABCDEF
jwt.expiration-minutes=60
app.security.enabled=false
app.access-device.module-enabled=true
app.access-device.api-key-required=false
app.access-snapshot.enabled=true
app.access-snapshot.validity-minutes=15
app.global-search.enabled=true
app.auth.registration-enabled=true
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:5177,http://localhost:5178,http://localhost:5179,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175,http://127.0.0.1:5176,http://127.0.0.1:5177,http://127.0.0.1:5178,http://127.0.0.1:5179

logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.web=INFO
logging.level.org.springframework.web=INFO
logging.level.com.extreme.gym=INFO
