spring.datasource.url=jdbc:h2:mem:extreme_local_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

app.auth.registration-enabled=${AUTH_REGISTRATION_ENABLED:false}

# JWT Configuration for Local Development
# Use um secret para testes locais. NUNCA use em produção!
jwt.secret=${JWT_SECRET:local-MzA3NDAzNTkwNzcwOTMzMDgyODI5NjM4NzYwNzA4Ng==}
jwt.expiration-minutes=1440

# Admin Credentials for Local Development
app.admin.email=${ADMIN_EMAIL:admin@extremegym.local}
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}
