# API isolada com H2 (perfil local) — ideal para desenvolvimento do frontend.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SKIP_TESTS: ${SKIP_TESTS:-true}
    container_name: extreme-gym-api-local
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 45s
