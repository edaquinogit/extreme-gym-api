spring.application.name=extreme-gym-api
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.jpa.open-in-view=false
server.port=8080

# JWT Configuration
# Em producao, JWT_SECRET deve ser obrigatoriamente fornecido via variavel de ambiente
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=60

# Security Configuration
app.security.enabled=true
app.auth.registration-enabled=${AUTH_REGISTRATION_ENABLED:false}

# Admin Bootstrap (usado apenas em dev/local)
app.admin.email=${ADMIN_EMAIL:admin@extremegym.com}
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:5177,http://localhost:5178,http://localhost:5179}
