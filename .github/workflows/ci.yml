name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  frontend-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

  frontend-lint:
    needs: frontend-install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend ESLint
        working-directory: frontend
        run: npm run lint

  frontend-type-check:
    needs: frontend-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend type check
        working-directory: frontend
        run: npm run type-check

  frontend-build:
    needs: frontend-type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  gateway-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install gateway dependencies
        working-directory: gateway
        run: npm ci

  gateway-audit:
    needs: gateway-install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install gateway dependencies
        working-directory: gateway
        run: npm ci
      - name: Run gateway production audit
        working-directory: gateway
        run: npm audit --production

  gateway-lint:
    needs: gateway-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install gateway dependencies
        working-directory: gateway
        run: npm ci
      - name: Run gateway ESLint
        working-directory: gateway
        run: npm run lint

  gateway-type-check:
    needs: gateway-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install gateway dependencies
        working-directory: gateway
        run: npm ci
      - name: Run gateway type check
        working-directory: gateway
        run: npm run type-check

  gateway-build:
    needs: gateway-type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install gateway dependencies
        working-directory: gateway
        run: npm ci
      - name: Build gateway
        working-directory: gateway
        run: npm run build

  gateway-test:
    needs: gateway-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install gateway dependencies
        working-directory: gateway
        run: npm ci
      - name: Run gateway tests
        working-directory: gateway
        run: npm run test
