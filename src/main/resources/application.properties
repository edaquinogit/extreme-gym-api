spring.application.name=extreme-gym-api
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.jpa.open-in-view=false
server.port=8080
spring.data.web.pageable.max-page-size=100

# JWT Security - REQUERIDO em produção, deve ser definido via variável de ambiente
# NUNCA use fallback/default aqui - falha rápido se não configurado
# Gere com: openssl rand -base64 32
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=60
app.security.enabled=true
app.auth.registration-enabled=${AUTH_REGISTRATION_ENABLED:false}
app.auth.max-failed-attempts=${AUTH_MAX_FAILED_ATTEMPTS:5}
app.auth.lock-duration-minutes=${AUTH_LOCK_DURATION_MINUTES:15}

# Access device/gateway contract flags
app.access-device.module-enabled=${ACCESS_DEVICE_MODULE_ENABLED:true}
app.access-device.api-key-required=${ACCESS_DEVICE_API_KEY_REQUIRED:true}
app.access-snapshot.enabled=${ACCESS_SNAPSHOT_ENABLED:true}
app.access-snapshot.validity-minutes=${ACCESS_SNAPSHOT_VALIDITY_MINUTES:15}
app.global-search.enabled=${GLOBAL_SEARCH_ENABLED:true}

# Admin credentials - REQUERIDO em produção, deve ser definido via variável de ambiente
# Senhas padrão devem ser alteradas imediatamente após primeiro login
app.admin.email=${ADMIN_EMAIL}
app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}
