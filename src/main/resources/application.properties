spring.application.name=extreme-gym-api
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.jpa.open-in-view=false
server.port=8080
spring.data.web.pageable.max-page-size=100

# JWT Security - REQUERIDO em producao, deve ser definido via variavel de ambiente.
# O fallback abaixo e intencionalmente inseguro para falhar rapido quando JWT_SECRET faltar.
# Gere com: openssl rand -base64 32
jwt.secret=${JWT_SECRET:dev-secret-change-me-should-fail-in-prod}
jwt.expiration-minutes=60
app.security.enabled=true
app.auth.registration-enabled=${AUTH_REGISTRATION_ENABLED:false}
app.auth.max-failed-attempts=${AUTH_MAX_FAILED_ATTEMPTS:5}
app.auth.lock-duration-minutes=${AUTH_LOCK_DURATION_MINUTES:15}
app.access.snapshot-ttl-minutes=${ACCESS_SNAPSHOT_TTL_MINUTES:360}

# Bootstrap controlado do ADMIN inicial.
# Deve ficar false por padrao e ser ligado apenas no primeiro provisionamento.
app.bootstrap-admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:false}

# Normalizacao rigorosa para o admin de bootstrap.
app.admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:admin@extremegym.local}
app.admin.username=${APP_BOOTSTRAP_ADMIN_USERNAME:admin}
app.admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
