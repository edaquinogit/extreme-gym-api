spring.datasource.url=jdbc:h2:mem:extreme_test_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

jwt.secret=ciJwtKeyForAutomatedTestsOnly2026SafeValueABCDEF
jwt.expiration-minutes=60
app.security.enabled=false
app.auth.registration-enabled=true

logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.web=INFO
logging.level.org.springframework.web=INFO
logging.level.com.extreme.gym=INFO
